name: check-types (тимчасова перевірка типів нерухомості й районів)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Які коди в комерції, будинків і приміських районів?
        # Без секретів: нічого не шле в Telegram і не чіпає state.json.
        # Друкує лише кількості, заголовки-шаблони сайту, назви полів і райони — без імен і телефонів.
        run: |
          python - <<'PY'
          import re, time
          import watcher as w
          base = "https://www.myhome.ge/ru/s/?deal_types=2&cities=1&currency_id=2&owner_type=physical"
          for name, extra in (("урбан 15", "&real_estate_types=1,2,3,5&urbans=15"),
                              ("урбан 13", "&real_estate_types=1,2,3,5&urbans=13"),
                              ("пригород", "&real_estate_types=1,2,3,5&districts=2"),
                              ("комерція від 600", "&real_estate_types=5&price_from=600"),
                              ("будинки від 1000", "&real_estate_types=2&price_from=1000")):
              try:
                  items = w.fetch_page(w.search_params(base + extra), 1)
              except Exception as e:
                  print(f"{name}: помилка {e}"); continue
              usd = [float(w.as_dict(w.as_dict(i.get("price")).get("2")).get("price_total") or 0) for i in items]
              places = sorted({(i.get("urban_id"), w.clean(i.get("urban_name"))) for i in items}, key=str)
              print(f"{name}: {len(items)} оголошень; $ від {min(usd, default=0):g}; райони: {places[:15]}")
              if items and "від" in name:
                  print("   приклад фактів:", w.facts_text(items[0]), "| заголовок:", re.sub(r"\d+", "#", w.clean(items[0].get("dynamic_title"))))
              time.sleep(1.5)
          PY
