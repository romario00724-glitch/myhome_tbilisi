name: check-types (тимчасова перевірка типів нерухомості й районів)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Які коди в комерції, будинків і приміських районів?
        # Без секретів: нічого не шле в Telegram і не чіпає state.json.
        # Друкує лише кількості, заголовки-шаблони сайту, назви полів і райони — без імен і телефонів.
        run: |
          python - <<'PY'
          import json, re, time
          import watcher as w
          NAMES = ("Каклеби", "Цавкиси", "Шиндиси", "Табахмела")
          base = "https://www.myhome.ge/ru/s/?deal_types=2&cities=1&owner_type=physical"
          seen_places = {}
          for ret in range(1, 7):
              url = base + f"&real_estate_types={ret}"
              try:
                  items = w.fetch_page(w.search_params(url), 1)
              except Exception as e:
                  print(f"тип {ret}: помилка {e}"); continue
              titles = sorted({re.sub(r"\d+", "#", w.clean(i.get("dynamic_title"))) for i in items})[:4]
              fields = sorted({k for i in items for k in i if "type" in k.lower()})
              vals = sorted({str(i.get("real_estate_type_id")) for i in items})
              print(f"тип {ret}: {len(items)} оголошень; заголовки: {titles}; поля з type: {fields}; real_estate_type_id: {vals}")
              for i in items:
                  key = (i.get("city_id"), w.clean(i.get("city_name")), i.get("district_id"), w.clean(i.get("district_name")), i.get("urban_id"), w.clean(i.get("urban_name")))
                  seen_places[key] = seen_places.get(key, 0) + 1
              time.sleep(1.5)
          print("місця (city_id, city, district_id, district, urban_id, urban):")
          for k, v in sorted(seen_places.items(), key=lambda kv: str(kv[0])):
              print("  ", k, v)

          # Чи є на сторінці пошуку довідник місць з цими назвами?
          html = w.http_get(w.list_url(w.search_params(base + "&real_estate_types=1"), 1), {"Accept-Language": w.LANG})
          data = json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S).group(1))
          found = []
          def walk(node, path):
              if isinstance(node, dict):
                  for v in node.values():
                      if isinstance(v, str) and any(n in v for n in NAMES):
                          found.append((path, {k: v for k, v in node.items() if not isinstance(v, (dict, list))}))
                          break
                  for k, v in node.items():
                      walk(v, path + "/" + str(k))
              elif isinstance(node, list):
                  for idx, v in enumerate(node):
                      walk(v, path + f"[{idx}]")
          walk(data, "")
          print("у даних сторінки згадок цих назв:", len(found))
          for path, d in found[:20]:
              print("  ", re.sub(r"\[\d+\]", "[]", path)[:120], json.dumps(d, ensure_ascii=False)[:300])
          keys = [q.get("queryKey") for q in data.get("props", {}).get("pageProps", {}).get("dehydratedState", {}).get("queries", [])]
          print("запити на сторінці:", [k[:2] if isinstance(k, list) else k for k in keys])
          PY
