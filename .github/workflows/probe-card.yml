name: probe-card (тимчасова розвідка картки оголошення)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Що є на сторінці оголошення
        # Без секретів. Друкує лише назви полів, типи й числа — без імен, телефонів і текстів (лог публічний).
        run: |
          python - <<'PY'
          import json, re
          import watcher as w
          label, url = w.load_searches()[0]
          items = w.fetch_page(w.search_params(url), 1)
          item = items[0]
          sid = int(item["id"])
          print("у видачі є поля:", ", ".join(sorted(item)))
          print("  user_type у видачі:", json.dumps(item.get("user_type"), ensure_ascii=False))
          try:
              w.http_get_json(w.detail_url(sid), w.api_headers())
              print("API картки: відкрите")
          except w.FetchError as e:
              print("API картки:", e)

          def walk(obj, path=""):
              if isinstance(obj, dict):
                  yield path, obj
                  for k, v in obj.items():
                      yield from walk(v, f"{path}.{k}")
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:50]):
                      yield from walk(v, f"{path}[{i}]")

          for kind, page_url in (("slug", w.listing_url(item)), ("pr", f"{w.SITE}/{w.LANG}/pr/{sid}/")):
              try:
                  text = w.http_get(page_url, {"Accept-Language": w.LANG})
              except w.FetchError as e:
                  print(f"[{kind}] сторінка: {e}")
                  continue
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', text, re.S)
              print(f"[{kind}] сторінка: {len(text)} символів; __NEXT_DATA__: {'є' if m else 'немає'}")
              if not m:
                  continue
              data = json.loads(m.group(1))
              props = w.as_dict(w.as_dict(data.get("props")).get("pageProps"))
              print("  pageProps:", ", ".join(sorted(props)))
              for q in w.as_dict(props.get("dehydratedState")).get("queries") or []:
                  d = w.as_dict(q.get("state")).get("data")
                  print("  запит:", json.dumps(q.get("queryKey"), ensure_ascii=False)[:150],
                        "→", ", ".join(sorted(d)) if isinstance(d, dict) else type(d).__name__)
              best = None
              for path, d in walk(data):
                  if w.to_int(d.get("id")) == sid and len(d) > 15 and (best is None or len(d) > len(best[1])):
                      best = (path, d)
              if not best:
                  print("  оголошення з цим id у даних сторінки не знайдено")
                  continue
              path, st = best
              print("  оголошення лежить у:", path)
              print("  поля:", ", ".join(sorted(st)))
              print("  user_type:", json.dumps(st.get("user_type"), ensure_ascii=False))
              print("  лічильник оголошень автора:", w.find_author_listing_count(st))
              phone = str(st.get("user_phone_number") or "")
              print("  телефон:", "немає" if not phone else f"{len(phone)} симв., прихований: {'*' in phone}")
              print("  опис: у видачі", len(w.clean(item.get("comment"))), "симв., на сторінці", len(w.clean(st.get("comment"))))
              print("  фото: у видачі", len(w.image_urls(item)), ", на сторінці", len(w.image_urls(st)))
              for k in ("user_id", "floor", "total_floors", "address", "created_at", "last_updated"):
                  print(f"  {k}: {'є' if w.clean(st.get(k)) else '—'}")
          PY
