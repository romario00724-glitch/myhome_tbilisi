name: check-search (тимчасова перевірка пошуку)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Пошук по Тбілісі віддає оголошення?
        # Без секретів: нічого не шле в Telegram і не чіпає state.json.
        # Друкує лише кількість, міста й райони — без імен і телефонів (лог публічний).
        run: |
          python - <<'PY'
          import watcher as w
          label, url = w.load_searches()[0]
          params = w.search_params(url)
          for page in (1, 2):
              items = w.fetch_page(params, page)
              cities = sorted({w.clean(i.get("city_name")) for i in items} - {""})
              districts = sorted({w.clean(i.get("urban_name")) for i in items} - {""})
              print(f"[{label}] сторінка {page}: {len(items)} оголошень; міста: {', '.join(cities) or '—'}")
              print(f"  райони: {', '.join(districts[:20]) or '—'}")
          item = w.enrich_with_details(items[0])
          print("картка оголошення читається:", "так" if item.get("user_id") or "_site_count" in item else "ні")
          PY
